<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Мир 8×8 — PvP</title>
  </head>
  <body>
    <canvas id="renderCanvas"></canvas>
    <div id="damage"></div>
    <div id="crosshair"></div>
    <div id="chargeBar"><div id="chargeFill"></div><span id="chargeText"></span></div>
    <div id="who"></div>
    <div id="scoreboard"></div>
    <div id="feed"></div>
    <div id="arrows"></div>
    <div id="toasts"></div>
    <div id="bars">
      <div id="loadout"></div>
      <div class="bar hp"><div class="fill" id="hpFill"></div><span id="hpText"></span></div>
      <div class="bar mana"><div class="fill" id="manaFill"></div><span id="manaText"></span></div>
    </div>
    <div id="overlay"></div>
    <div id="hint">Клик — захват мыши · WASD — движение · Space — прыжок · C / Ctrl — присед · Shift — спринт · ЛКМ — выстрел · ПКМ (удерживать) — заряженный луч · Esc — отпустить</div>
    <div id="debug"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
