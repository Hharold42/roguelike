<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Рейкаст-прототип</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0a0f;
        color: #e8e8f0;
        font-family: 'Segoe UI', system-ui, sans-serif;
      }
      #screen {
        width: 100%;
        height: 100%;
        display: block;
        outline: none;
        image-rendering: crisp-edges;
        image-rendering: pixelated;
        cursor: pointer;
      }
      #stats {
        position: fixed;
        top: 12px;
        left: 12px;
        font-size: 14px;
        line-height: 1.6;
        text-shadow: 0 1px 3px #000;
        user-select: none;
        pointer-events: none;
        white-space: pre;
      }
      #stats b { color: #ffd166; }
      #hint {
        position: fixed;
        bottom: 14px;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 14px;
        opacity: 0.75;
        text-shadow: 0 1px 3px #000;
        user-select: none;
        pointer-events: none;
      }
      #cross {
        position: fixed;
        left: 50%;
        top: 50%;
        width: 4px;
        height: 4px;
        margin: -2px 0 0 -2px;
        background: rgba(255, 255, 255, 0.9);
        box-shadow: 0 0 3px #000;
        pointer-events: none;
      }
      #back {
        position: fixed;
        right: 12px;
        bottom: 10px;
        color: #9ab;
        font-size: 13px;
        text-decoration: none;
        opacity: 0.7;
      }
      #back:hover { color: #fff; opacity: 1; }
    </style>
  </head>
  <body>
    <canvas id="screen"></canvas>
    <div id="stats">Запекание мира…</div>
    <div id="cross"></div>
    <div id="hint">Клик — захват мыши · WASD — движение · Shift — бег · мышь — обзор · 1/2/3 — разрешение · Esc — отпустить</div>
    <a id="back" href="/">← назад в игру</a>
    <script type="module" src="/src/raytrace.ts"></script>
  </body>
</html>
