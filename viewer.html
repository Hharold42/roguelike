<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Просмотр персонажа</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0a0f;
        color: #e8e8f0;
        font-family: 'Segoe UI', system-ui, sans-serif;
      }
      #renderCanvas {
        width: 100%;
        height: 100%;
        display: block;
        outline: none;
        touch-action: none;
      }
      #panel {
        position: fixed;
        top: 12px;
        left: 12px;
        width: 280px;
        max-height: calc(100% - 24px);
        overflow-y: auto;
        background: rgba(15, 15, 25, 0.9);
        border: 1px solid #33334a;
        border-radius: 12px;
        padding: 14px 16px;
        font-size: 14px;
        line-height: 1.5;
        user-select: none;
        box-sizing: border-box;
      }
      #panel h2 {
        margin: 0 0 10px;
        font-size: 16px;
        color: #ffd166;
        display: flex;
        justify-content: space-between;
        align-items: baseline;
      }
      #panel h2 a {
        font-size: 13px;
        font-weight: 400;
        color: #9ab;
        text-decoration: none;
      }
      #panel h2 a:hover { color: #fff; }
      #panel section { margin-bottom: 12px; }
      #panel label {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        padding: 2px 0;
      }
      #panel input[type="range"] { flex: 1; }
      #panel .kv { display: grid; grid-template-columns: auto 1fr; gap: 0 10px; }
      #panel .kv span:nth-child(odd) { opacity: 0.6; }
      #panel .kv span:nth-child(even) { text-align: right; overflow-wrap: anywhere; }
      #panel button, #panel .filebtn {
        display: block;
        width: 100%;
        padding: 8px 10px;
        margin-top: 8px;
        background: #1d1d2c;
        border: 1px solid #33334a;
        border-radius: 8px;
        color: #e8e8f0;
        font: inherit;
        cursor: pointer;
        text-align: center;
        box-sizing: border-box;
      }
      #panel button:hover, #panel .filebtn:hover { border-color: #ffd166; }
      #panel .hint { opacity: 0.55; font-size: 12px; margin-top: 6px; }
      .ok { color: #7bd88f; }
      .warn { color: #ffb347; }
      #drop {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(255, 209, 102, 0.12);
        border: 3px dashed #ffd166;
        font-size: 28px;
        font-weight: 600;
        pointer-events: none;
      }
      #status {
        position: fixed;
        bottom: 12px;
        left: 12px;
        font-size: 13px;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <canvas id="renderCanvas"></canvas>
    <div id="panel">
      <h2>Персонаж <a href="/">← в игру</a></h2>

      <section>
        <label><input type="checkbox" id="walk" /> Ходьба <small>(пробел)</small></label>
        <label><input type="checkbox" id="crouch" /> Присед <small>(C)</small></label>
        <label><button type="button" id="jump">Прыжок</button> <small>(J)</small></label>
        <label><input type="checkbox" id="turntable" /> Вращать</label>
        <label><input type="checkbox" id="skeleton" /> Скелет</label>
        <label><input type="checkbox" id="wireframe" /> Каркас</label>
        <label>Разворот <input type="range" id="yaw" min="-180" max="180" step="5" value="0" /> <span id="yawVal">0°</span></label>
        <label>Оружие
          <select id="weapon">
            <option value="gun">Пистолет</option>
            <option value="sword">Меч</option>
            <option value="none">Нет</option>
          </select>
        </label>
      </section>

      <section>
        <div class="kv" id="info"></div>
      </section>

      <section>
        <label class="filebtn" for="file">Открыть GLB…</label>
        <input type="file" id="file" accept=".glb,.gltf" hidden />
        <button id="reload">Перезагрузить player.glb</button>
        <button id="procedural">Процедурный персонаж</button>
        <div class="hint">Можно просто перетащить .glb в окно. ЛКМ — вращать камеру, колесо — зум, ПКМ — сдвиг.</div>
      </section>
    </div>
    <div id="drop">Отпустите, чтобы загрузить модель</div>
    <div id="status"></div>
    <script type="module" src="/src/viewer.ts"></script>
  </body>
</html>
